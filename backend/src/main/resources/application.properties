spring.application.name=backend

# Render web services expect the app to listen on 0.0.0.0. The default
# Render port is 10000; PORT can still override it when provided.
server.address=0.0.0.0
server.port=${PORT:10000}

# The DataSource itself is created by DatabaseConfig from DATABASE_URL.
# Hibernate may create/update tables as backend entities are added.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Keep repository initialization lazy to reduce cold-start work.
spring.data.jpa.repositories.bootstrap-mode=lazy

# Hikari settings suited to a small hosted app using Neon.
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=0
spring.datasource.hikari.initialization-fail-timeout=-1
spring.datasource.hikari.connection-timeout=10000

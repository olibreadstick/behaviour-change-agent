name: Website checks
on:
  pull_request:
  push:
    branches: [render-deployment]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            mobile/package-lock.json
      - run: npm ci
      - run: npm --prefix mobile ci
      - run: npx tsc --noEmit
      - run: npm --prefix mobile run typecheck
      - run: npm run test:website
      - run: npm --prefix mobile test
      - run: npm run build
      - run: node scripts/check-website-build.mjs

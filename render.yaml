services:
  - type: web
    name: behaviour-change-agent-backend
    runtime: docker
    plan: free
    region: ohio
    rootDir: backend
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: ADMIN_USERNAME
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: FRONTEND_URL
        value: https://behaviour-change-agent.vercel.app
